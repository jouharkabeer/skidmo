[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Force HTTPS (Facebook & crawlers should not scrape http://)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Contact form API
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Sanity API proxy — must come BEFORE the SPA catch-all
[[redirects]]
  from = "/sanity-api/*"
  to = "https://idpcv35f.api.sanity.io/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent Range requests returning 206 to Facebook/crawlers
[[headers]]
  for = "/*"
  [headers.values]
    Accept-Ranges = "none"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "image/jpeg"
    Accept-Ranges = "none"

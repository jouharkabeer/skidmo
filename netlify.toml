[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Contact form API
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Sanity API proxy — must come BEFORE the SPA catch-all
[[redirects]]
  from = "/sanity-api/*"
  to = "https://5o4lc5ha.api.sanity.io/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

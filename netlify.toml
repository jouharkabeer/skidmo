[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Force HTTPS (Facebook & crawlers should not scrape http://)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Contact form API
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Sanity API proxy — must come BEFORE the SPA catch-all
[[redirects]]
  from = "/sanity-api/*"
  to = "https://idpcv35f.api.sanity.io/:splat"
  status = 200
  force = true

# Prerendered routes — 200 rewrite (no trailing-slash 301 for crawlers)
[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery/index.html"
  status = 200

[[redirects]]
  from = "/offers"
  to = "/offers/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent Range requests returning 206 to Facebook/crawlers
[[headers]]
  for = "/*"
  [headers.values]
    Accept-Ranges = "none"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "image/jpeg"
    Accept-Ranges = "none"

# Optional TLS nginx config — copy over deploy/nginx.conf after Certbot
# See deploy.md section 7.

upstream django_upstream {
  server backend:8000;
}

upstream frontend_upstream {
  server frontend:80;
}

server {
  listen 80;
  server_name skidmosa.com www.skidmosa.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name skidmosa.com www.skidmosa.com;
  client_max_body_size 25M;

  ssl_certificate     /etc/letsencrypt/live/skidmosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/skidmosa.com/privkey.pem;

  location /api/ {
    proxy_pass http://django_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /media/ {
    alias /var/www/media/;
    access_log off;
    expires 7d;
  }

  location /static/ {
    alias /var/www/static/;
    access_log off;
    expires 7d;
  }

  location /django-admin/ {
    proxy_pass http://django_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
